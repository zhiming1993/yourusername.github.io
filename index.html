<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42 号抽奖转盘</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --card: rgba(15, 23, 42, 0.85);
      --accent: #38bdf8;
      --accent-strong: #22d3ee;
      --text: #e2e8f0;
      --muted: #94a3b8;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, rgba(56, 189, 248, 0.35), transparent 55%),
        radial-gradient(circle at bottom, rgba(168, 85, 247, 0.2), transparent 50%),
        linear-gradient(160deg, #020617, #0f172a 55%, #020617);
      color: var(--text);
      padding: 24px;
    }

    .app {
      width: min(920px, 100%);
      display: grid;
      gap: 24px;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }

    .panel {
      background: var(--card);
      border-radius: 24px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      padding: 28px 32px;
      backdrop-filter: blur(18px);
      box-shadow: 0 28px 60px rgba(15, 23, 42, 0.45);
      position: relative;
      overflow: hidden;
    }

    .panel::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      background: linear-gradient(140deg, rgba(56, 189, 248, 0.18), transparent 35%, transparent 65%, rgba(168, 85, 247, 0.16));
      opacity: 0.7;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(28px, 4vw, 38px);
      letter-spacing: 0.04em;
    }

    p.desc {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .wheel-container {
      position: relative;
      display: grid;
      place-items: center;
    }

    #wheel {
      position: relative;
      width: min(360px, 70vw);
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      border: 12px solid rgba(148, 163, 184, 0.25);
      box-shadow: inset 0 0 0 6px rgba(15, 23, 42, 0.6), 0 24px 40px rgba(15, 23, 42, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 5.2s cubic-bezier(0.12, 0.62, 0, 1);
      overflow: hidden;
    }

    #wheel.spinning {
      cursor: progress;
    }

    #wheel::before {
      content: "";
      position: absolute;
      inset: 14%;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.35);
      box-shadow: inset 0 12px 28px rgba(2, 6, 23, 0.55);
    }

    #wheel .label {
      position: absolute;
      font-size: 15px;
      font-weight: 600;
      color: rgba(15, 23, 42, 0.85);
      background: rgba(226, 232, 240, 0.8);
      padding: 4px 10px;
      border-radius: 999px;
      transform-origin: center center;
      transition: transform 5.2s cubic-bezier(0.12, 0.62, 0, 1);
      letter-spacing: 0.01em;
      user-select: none;
    }

    .pointer {
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translate(-50%, 0);
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-bottom: 30px solid var(--accent-strong);
      filter: drop-shadow(0 6px 12px rgba(34, 211, 238, 0.6));
      z-index: 10;
    }

    .pointer::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 18px;
      transform: translate(-50%, 0);
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #0f172a;
      border: 3px solid var(--accent-strong);
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.9);
    }

    button {
      appearance: none;
      border: none;
      padding: 14px 24px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: #0f172a;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 16px 32px rgba(34, 211, 238, 0.35);
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      box-shadow: none;
      transform: none !important;
    }

    button:not(:disabled):hover {
      transform: translateY(-2px) scale(1.01);
    }

    button:not(:disabled):active {
      transform: translateY(0) scale(0.99);
    }

    .controls {
      display: grid;
      gap: 18px;
      justify-items: start;
      margin-top: 22px;
    }

    .result {
      font-size: clamp(22px, 3vw, 28px);
      font-weight: 700;
      color: var(--accent-strong);
      letter-spacing: 0.08em;
    }

    .history {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
      font-size: 15px;
    }

    .history li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(148, 163, 184, 0.12);
      border: 1px solid rgba(148, 163, 184, 0.18);
    }

    .history span.badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 40px;
      padding: 4px 10px;
      background: rgba(34, 211, 238, 0.18);
      border-radius: 999px;
      color: var(--accent-strong);
      font-weight: 600;
    }

    .muted {
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 680px) {
      .panel {
        padding: 24px;
      }

      #wheel {
        width: min(320px, 85vw);
      }

      #wheel .label {
        font-size: 14px;
        padding: 3px 8px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel" style="grid-column: 1 / -1;">
      <h1>42 号抽奖转盘</h1>
      <p class="desc">点击下方按钮开始抽取号码。系统会自动记录最近一次的中奖号码，祝你好运！</p>
    </section>

    <section class="panel">
      <div class="wheel-container">
        <div class="pointer" aria-hidden="true"></div>
        <div id="wheel" role="img" aria-label="抽奖转盘，包含 42 个号码"></div>
      </div>
      <div class="controls">
        <button id="spinBtn" type="button">开始抽奖</button>
        <div class="muted">每次抽奖都会随机旋转多圈，确保公平随机。</div>
      </div>
    </section>

    <section class="panel">
      <div class="result" id="result">准备就绪</div>
      <p class="muted">点击“开始抽奖”后，等待转盘停止即可看到中奖号码。</p>
      <h2 style="margin: 26px 0 12px; font-size: 18px; letter-spacing: 0.06em;">最近 6 次结果</h2>
      <ul class="history" id="history"></ul>
    </section>
  </main>

  <script>
    const wheel = document.getElementById('wheel');
    const spinBtn = document.getElementById('spinBtn');
    const resultEl = document.getElementById('result');
    const historyEl = document.getElementById('history');

    const numbers = Array.from({ length: 42 }, (_, index) => index + 1);
    const segmentAngle = 360 / numbers.length;
    const colors = ['#bae6fd', '#fbcfe8', '#c7d2fe', '#bbf7d0'];
    let currentRotation = 0;

    function setupWheel() {
      const gradientParts = numbers.map((_, index) => {
        const start = index * segmentAngle;
        const end = (index + 1) * segmentAngle;
        const color = colors[index % colors.length];
        return `${color} ${start}deg ${end}deg`;
      });
      wheel.style.background = `conic-gradient(from -90deg, ${gradientParts.join(', ')})`;

      const labelDistance = 42;
      numbers.forEach((num, index) => {
        const label = document.createElement('span');
        label.className = 'label';
        label.textContent = String(num).padStart(2, '0');
        const angle = index * segmentAngle + segmentAngle / 2;
        const radians = (angle - 90) * (Math.PI / 180);
        label.style.left = `${50 + Math.cos(radians) * labelDistance}%`;
        label.style.top = `${50 + Math.sin(radians) * labelDistance}%`;
        label.style.transform = `translate(-50%, -50%) rotate(${ -angle }deg)`;
        wheel.appendChild(label);
      });
    }

    function updateHistory(value) {
      const item = document.createElement('li');
      const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
      item.innerHTML = `<span>抽中 <strong>${value}</strong> 号</span><span class="badge">${time}</span>`;
      historyEl.prepend(item);
      while (historyEl.children.length > 6) {
        historyEl.removeChild(historyEl.lastChild);
      }
    }

    function spinWheel() {
      if (wheel.classList.contains('spinning')) {
        return;
      }

      wheel.classList.add('spinning');
      spinBtn.disabled = true;
      resultEl.textContent = '抽奖进行中…';

      const extraSpins = Math.floor(Math.random() * 4 + 6) * 360;
      const extraAngle = Math.random() * 360;
      currentRotation += extraSpins + extraAngle;
      wheel.style.transform = `rotate(${currentRotation}deg)`;
    }

    function handleTransitionEnd(event) {
      if (event.propertyName !== 'transform') {
        return;
      }

      const normalizedRotation = ((currentRotation % 360) + 360) % 360;
      const angleAtPointer = (360 - normalizedRotation + segmentAngle / 2 + 360) % 360;
      const index = Math.floor(angleAtPointer / segmentAngle) % numbers.length;
      const winningNumber = numbers[index];

      resultEl.textContent = `中奖号码：${String(winningNumber).padStart(2, '0')}`;
      updateHistory(String(winningNumber).padStart(2, '0'));

      wheel.classList.remove('spinning');
      spinBtn.disabled = false;
    }

    spinBtn.addEventListener('click', spinWheel);
    wheel.addEventListener('transitionend', handleTransitionEnd);

    setupWheel();
  </script>
</body>
</html>
