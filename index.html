<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>班級抽籤器</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --line: #334155;
      --text: #e2e8f0;
      --accent: #22d3ee;
      --danger: #fb7185;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(145deg, #020617, var(--bg));
      color: var(--text);
    }
    .wrap { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
    .card {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(17, 24, 39, 0.95);
      margin-bottom: 16px;
      overflow: hidden;
    }
    .card h1, .card h2 { margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .content { padding: 14px 16px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    input, select, button {
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #0b1220;
      color: var(--text);
      padding: 8px 10px;
      font-size: 14px;
    }
    button { cursor: pointer; }
    .primary { border-color: #0e7490; background: #155e75; }
    .danger { border-color: #be123c; background: #9f1239; }
    .pill {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: #cbd5e1;
      font-size: 13px;
    }
    .result {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
      margin: 10px 0;
      min-height: 36px;
    }
    .hint { color: #94a3b8; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #1f2937; padding: 8px; text-align: left; font-size: 14px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 800px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="card">
      <h1>有趣班級抽籤器（可重抽 / 輪次保證）</h1>
      <div class="content">
        <div class="row">
          <label>題號：<input id="questionNo" type="number" min="1" value="1" /></label>
          <label>抽籤方式：
            <select id="drawMode">
              <option value="random">隨機抽（推薦）</option>
              <option value="seat_asc">座號順序</option>
              <option value="seat_desc">座號逆序</option>
            </select>
          </label>
          <button id="drawBtn" class="primary">抽一位同學</button>
          <button id="rerollBtn" class="danger">重抽（上一位作廢）</button>
          <button id="resetBtn">全部重置</button>
        </div>
        <div class="row" style="margin-top: 10px;">
          <span class="pill">目前第 <span id="roundNum">1</span> 輪</span>
          <span class="pill">本輪剩餘：<span id="remainingCount">0</span> 人</span>
          <span class="pill">總人數：<span id="totalCount">0</span> 人</span>
        </div>
        <div class="result" id="currentResult">請先按「抽一位同學」</div>
        <div class="hint">規則：每輪會先讓全班都被抽過一次。當本輪 46 人全抽完，系統才會自動進入下一輪。</div>
      </div>
    </section>

    <section class="card grid">
      <div class="content">
        <h2 style="padding:0;border:0;margin-bottom:8px;">抽中紀錄</h2>
        <table>
          <thead>
            <tr><th>次序</th><th>輪次</th><th>題號</th><th>座號</th><th>姓名</th></tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
      <div class="content">
        <h2 style="padding:0;border:0;margin-bottom:8px;">班級名單</h2>
        <table>
          <thead>
            <tr><th>座號</th><th>姓名</th><th>本輪狀態</th></tr>
          </thead>
          <tbody id="studentBody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    const students = [
      { seat: 1, name: '余姵瑾' }, { seat: 2, name: '陳靖彤' }, { seat: 3, name: '張鶴馨' },
      { seat: 4, name: '張馨樂' }, { seat: 5, name: '章芷蒽' }, { seat: 6, name: '蔡宇晴' },
      { seat: 7, name: '劉恩彤' }, { seat: 8, name: '符萫琪' }, { seat: 9, name: '王慧芩' },
      { seat: 10, name: '戴汶鍹' }, { seat: 11, name: '許家寧' }, { seat: 12, name: '李卓言' },
      { seat: 13, name: '梁靜恩' }, { seat: 14, name: '羅馷琁' }, { seat: 15, name: '詹杺淣' },
      { seat: 16, name: '陳穎芊' }, { seat: 17, name: '彭新煣' }, { seat: 18, name: '陳思穎' },
      { seat: 19, name: '鄭宇玲' }, { seat: 20, name: '楊悻甯' }, { seat: 21, name: '姚佩茹' },
      { seat: 22, name: '夏雨恆' }, { seat: 23, name: '周劭煌' }, { seat: 24, name: '張勝沅' },
      { seat: 25, name: '周敬升' }, { seat: 26, name: '房俊岑' }, { seat: 27, name: '吳瑞仁' },
      { seat: 28, name: '伍洧彬' }, { seat: 29, name: '伍洧騰' }, { seat: 30, name: '韓佳源' },
      { seat: 31, name: '林煜昕' }, { seat: 32, name: '江為赫' }, { seat: 33, name: '李承澤' },
      { seat: 34, name: '李楷樂' }, { seat: 35, name: '李智恩' }, { seat: 36, name: '林成浠' },
      { seat: 37, name: '黃冠杰' }, { seat: 38, name: '吳泓錠' }, { seat: 39, name: '陳宇峻' },
      { seat: 40, name: '鄭合益' }, { seat: 41, name: '鄭敬勳' }, { seat: 42, name: '鄭叡陽' },
      { seat: 43, name: '鄭宇謙' }, { seat: 44, name: '陳晉衡' }, { seat: 45, name: '黃智瑋' },
      { seat: 46, name: '楊功耀' }
    ];

    let round = 1;
    let remainingSeats = students.map((s) => s.seat);
    const history = [];

    const drawBtn = document.getElementById('drawBtn');
    const rerollBtn = document.getElementById('rerollBtn');
    const resetBtn = document.getElementById('resetBtn');
    const drawMode = document.getElementById('drawMode');
    const questionNo = document.getElementById('questionNo');

    function pickSeat() {
      if (remainingSeats.length === 0) {
        round += 1;
        remainingSeats = students.map((s) => s.seat);
      }

      if (drawMode.value === 'seat_asc') {
        return [...remainingSeats].sort((a, b) => a - b)[0];
      }
      if (drawMode.value === 'seat_desc') {
        return [...remainingSeats].sort((a, b) => b - a)[0];
      }
      const idx = Math.floor(Math.random() * remainingSeats.length);
      return remainingSeats[idx];
    }

    function drawOne() {
      const seat = pickSeat();
      const student = students.find((s) => s.seat === seat);
      remainingSeats = remainingSeats.filter((s) => s !== seat);

      const record = {
        order: history.length + 1,
        round,
        question: Number(questionNo.value) || 1,
        seat: student.seat,
        name: student.name
      };
      history.push(record);
      document.getElementById('currentResult').textContent = `第 ${record.round} 輪・題號 ${record.question}：${record.seat} 號 ${record.name}`;
      render();
    }

    function reroll() {
      if (history.length === 0) {
        document.getElementById('currentResult').textContent = '目前沒有可重抽的紀錄';
        return;
      }
      const last = history.pop();
      if (!remainingSeats.includes(last.seat)) {
        remainingSeats.push(last.seat);
      }
      document.getElementById('currentResult').textContent = `已作廢：${last.seat} 號 ${last.name}，請重新抽籤`;
      render();
    }

    function resetAll() {
      round = 1;
      remainingSeats = students.map((s) => s.seat);
      history.length = 0;
      document.getElementById('currentResult').textContent = '已重置，請重新抽籤';
      render();
    }

    function render() {
      document.getElementById('roundNum').textContent = round;
      document.getElementById('remainingCount').textContent = remainingSeats.length;
      document.getElementById('totalCount').textContent = students.length;

      const historyBody = document.getElementById('historyBody');
      historyBody.innerHTML = '';
      [...history].reverse().forEach((item) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${item.order}</td><td>${item.round}</td><td>${item.question}</td><td>${item.seat}</td><td>${item.name}</td>`;
        historyBody.appendChild(tr);
      });

      const studentBody = document.getElementById('studentBody');
      studentBody.innerHTML = '';
      students.forEach((s) => {
        const answered = !remainingSeats.includes(s.seat);
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${s.seat}</td><td>${s.name}</td><td>${answered ? '✅ 已抽到' : '⏳ 未抽到'}</td>`;
        studentBody.appendChild(tr);
      });
    }

    drawBtn.addEventListener('click', drawOne);
    rerollBtn.addEventListener('click', reroll);
    resetBtn.addEventListener('click', resetAll);

    render();
  </script>
</body>
</html>
